# Stack do Docker Swarm.
#
# Diferenças em relação ao docker-compose.yml (que continua valendo para
# desenvolvimento e para deploy simples):
#
#   - Swarm NÃO constrói imagem. Rode `deploy/swarm/publicar.sh` antes: ele
#     builda as imagens com nome fixo, e o deploy só as referencia.
#   - `depends_on` é ignorado pelo Swarm. Quem garante a ordem é o
#     entrypoint.sh, que espera o MySQL responder antes de migrar.
#   - Senhas entram como secret (arquivo em /run/secrets/), não como variável:
#     `docker inspect` mostra environment, mas não mostra secret.
#
# Deploy:  docker stack deploy -c deploy/swarm/stack.yml --resolve-image never chamados

version: "3.8"

services:
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # O banco de hoje tem poucos MB — cabe inteiro em memória com folga, e o
      # padrão de 128M já bastaria. 1G é margem para os próximos anos de
      # chamados, não correção de gargalo atual.
      - --innodb-buffer-pool-size=1G
      # 8 workers x 2 threads x 2 réplicas = teto de ~32 conexões; 151 é o
      # padrão e sobra. Explícito para ninguém escalar workers e esbarrar aqui.
      - --max-connections=200
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sistema_chamados}
      MYSQL_USER: ${DB_USER:-chamados}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: America/Sao_Paulo
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - interna
    deploy:
      # Banco NÃO escala em réplica: duas instâncias no mesmo volume corrompem
      # os dados. Se um dia houver segundo nó, replicação de MySQL é outro
      # assunto — não é `replicas: 2`.
      replicas: 1
      placement:
        constraints:
          - node.role == manager      # o volume local vive neste nó
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        order: stop-first             # nunca dois MySQL no mesmo volume
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  backend:
    image: chamados-backend:latest
    environment:
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DB_NAME: ${DB_NAME:-sistema_chamados}
      DB_USER: ${DB_USER:-chamados}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_HOST: db
      DB_PORT: "3306"
      # Capacidade real de atendimento simultâneo. A VPS tem 4 vCPU; a regra
      # (2 x núcleos) + 1 daria 9 workers em UMA instância. Como são 2
      # réplicas na mesma máquina, cada uma leva ~metade: 2 x 4 = 8 workers
      # somados, cada um com 2 threads. Passar disso só aumenta a briga por
      # CPU — o gargalo deixa de ser fila e vira troca de contexto.
      WEB_CONCURRENCY: "4"
      GUNICORN_THREADS: "2"
    secrets:
      - django_secret_key
      - db_password
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - interna
    deploy:
      replicas: 2
      resources:
        limits:
          # teto por réplica: duas réplicas não podem, juntas, engolir a
          # máquina e deixar o MySQL sem CPU
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # sobe a nova antes de derrubar a velha: atualização sem janela
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1

  web:
    image: chamados-web:latest
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    configs:
      - source: nginx_default
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_proxy_params
        target: /etc/nginx/proxy_params_chamados
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - interna
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

networks:
  interna:
    driver: overlay
    # só os serviços da stack entram; nada de fora alcança o banco
    internal: false

volumes:
  db_data:
  static_data:
  media_data:
  certbot_www:
  certbot_conf:

# Criados antes do deploy — ver deploy/swarm/publicar.sh
secrets:
  django_secret_key:
    external: true
  db_password:
    external: true
  db_root_password:
    external: true

# Config em vez de bind mount: no Swarm o arquivo é distribuído pelo cluster,
# não precisa existir no disco do nó que roda o container.
configs:
  nginx_default:
    file: ../nginx/default.conf
  nginx_proxy_params:
    file: ../nginx/proxy_params_chamados
