# Versão COM certificado. Use depois que o certbot emitir o certificado:
#
#   cp deploy/nginx/default-ssl.conf deploy/nginx/default.conf
#   docker compose restart web
#
# (o arquivo entra por bind mount — trocar não exige rebuild de imagem)

upstream django {
    server backend:8000;
}

# HTTP: só renovação do certificado e redirecionamento pro HTTPS
server {
    listen 80;
    server_name os.bragancapta.sp.gov.br 2.24.89.242;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://os.bragancapta.sp.gov.br$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name os.bragancapta.sp.gov.br;

    ssl_certificate     /etc/letsencrypt/live/os.bragancapta.sp.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.bragancapta.sp.gov.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # plantas de prédio são imagens grandes; o padrão de 1M rejeitaria o upload
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    location /admin/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
