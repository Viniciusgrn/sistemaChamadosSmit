# MODELO do site no nginx do HOST. Não é usado direto: o
# deploy/instalar-nginx-host.sh substitui os marcadores e escreve o arquivo
# final em /etc/nginx/sites-available/.
#
#   __DOMINIO__  domínio público do sistema
#   __PORTA__    porta de loopback onde a stack responde (HTTP_PORT do .env)
#
# O certbot reescreve este arquivo ao emitir o certificado, acrescentando o
# bloco 443 e o redirecionamento — por isso aqui só existe a porta 80.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # As plantas dos andares chegam a alguns MB. Sem isto o upload morre nesta
    # camada com 413, mesmo o container aceitando 25M: entre dois nginx, o
    # limite MENOR é o que vale.
    client_max_body_size 25M;

    access_log /var/log/nginx/chamados-access.log;
    error_log  /var/log/nginx/chamados-error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # o certbot troca para https no bloco 443 que ele gera; é este cabeçalho
        # que faz o Django reconhecer a conexão como segura (SECURE_PROXY_SSL_HEADER)
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
