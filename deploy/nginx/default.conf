# nginx DE DENTRO do container: serve a SPA e roteia /api pro gunicorn.
#
# Ele NÃO é a porta de entrada. Quem atende 80/443 na VPS é o nginx do host,
# que já cuida do TLS de todos os sistemas e faz proxy_pass pra cá
# (modelo em deploy/nginx/host-chamados.conf).
#
#   internet → nginx do host (TLS) → 127.0.0.1:8003 → este nginx ─┬─ SPA
#                                                                 └─ gunicorn

# Com DOIS proxies em série, $scheme aqui dentro é sempre "http" — o TLS
# terminou lá fora. Repassar $scheme faria o Django concluir que a conexão é
# insegura: com DJANGO_HTTPS=1 ele descartaria o cookie de sessão e o login
# entraria em loop sem erro nenhum na tela.
# Então: usa o que o host mandou; só cai em $scheme se vier vazio.
map $http_x_forwarded_proto $esquema_original {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # plantas de prédio são imagens grandes; o padrão de 1M rejeitaria o upload.
    # ATENÇÃO: precisa estar no nginx do HOST também — o limite menor vence.
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    location /admin/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    # coletados pelo collectstatic (admin do Django e browsable API do DRF)
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # uploads (plantas dos andares)
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # o Vite versiona o nome de cada arquivo em /assets — cache longo é seguro
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota do react-router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
