# Porta de entrada única do sistema: SPA, API, admin, static e uploads saem
# todos do mesmo host — é isso que permite cookie de sessão sem CORS.

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name os.bragancapta.sp.gov.br 2.24.89.242;

    # Validação do Let's Encrypt: o certbot grava o desafio neste volume e o
    # nginx precisa servi-lo em HTTP puro, antes de existir certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # plantas de prédio são imagens grandes; o padrão de 1M rejeitaria o upload
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    location /admin/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_chamados;
    }

    # coletados pelo collectstatic (admin do Django e browsable API do DRF)
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # uploads (plantas dos andares)
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # o Vite versiona o nome de cada arquivo em /assets — cache longo é seguro
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota do react-router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
