# Porteiro do prédio: derruba requisição que não declara um domínio conhecido.
#
# Sem um `default_server`, o nginx entrega a requisição ao PRIMEIRO bloco
# carregado — e os includes são lidos em ordem alfabética. Foi assim que, na
# outra máquina, acessar um domínio não configurado caiu num site qualquer.
#
# 444 fecha a conexão sem responder nada. É o tratamento certo para varredura
# automática, que bate direto no IP procurando o que houver: quem digitou o
# endereço certo nunca chega aqui.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}
