# Site do nginx DO HOST (nginx 1.24 do Ubuntu, o mesmo que serve mangacutter,
# concursos, nihondle...). Mesmo padrão dos outros: TLS aqui, proxy_pass para o
# container preso no loopback.
#
# Instalar:
#   sudo cp deploy/nginx/host-chamados.conf /etc/nginx/sites-available/os.bragancapta.sp.gov.br
#   sudo ln -s /etc/nginx/sites-available/os.bragancapta.sp.gov.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# O certificado sai pelo certbot que já existe no host, DEPOIS que este arquivo
# estiver no ar e o DNS apontando pra cá:
#   sudo certbot --nginx -d os.bragancapta.sp.gov.br
#
# O certbot reescreve este arquivo sozinho, acrescentando o bloco 443 e o
# redirecionamento. Por isso aqui só existe a porta 80.

server {
    listen 80;
    listen [::]:80;
    # Três nomes atendem o mesmo sistema:
    #   os.braganca.sp.gov.br     PRINCIPAL (zona na Cloudflare)
    #   os.bragancapta.sp.gov.br  em uso hoje (zona na HostGator)
    #   so.bragancapta.sp.gov.br  histórico: foi criado com as letras trocadas
    #
    # O primeiro da lista é o que o nginx usa como $server_name quando precisa
    # montar uma URL sozinho — por isso o principal vem primeiro.
    server_name os.braganca.sp.gov.br
                os.bragancapta.sp.gov.br
                so.bragancapta.sp.gov.br;

    # As plantas dos andares chegam a alguns MB. Sem isto aqui o upload morre
    # nesta camada com 413, mesmo o container aceitando 25M — entre dois
    # nginx, o limite MENOR é o que vale.
    client_max_body_size 25M;

    access_log /var/log/nginx/chamados-access.log;
    error_log  /var/log/nginx/chamados-error.log;

    location / {
        # 8003 é o HTTP_PORT do .env da stack. Livre nesta VPS: 8000, 8001,
        # 8002, 8080, 8085-8088 já estão ocupados pelos outros sistemas.
        proxy_pass http://127.0.0.1:8003;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # o certbot troca isto para https no bloco 443 que ele gera; é este
        # cabeçalho que faz o Django reconhecer a conexão como segura
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
