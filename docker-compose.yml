# Stack de produção: nginx (SPA + proxy) → gunicorn/Django → MySQL.
#
# Só o nginx publica porta no host. Banco e Django ficam na rede interna do
# compose, inalcançáveis de fora da VPS.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=200
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # o backend só migra depois que o MySQL aceita conexão de verdade
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backendChamados
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      # ligue quando o domínio já estiver com TLS; antes disso o cookie
      # "secure" impede o login em HTTP e a tela fica em loop
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      REDE_CHAVE_CIFRA: ${REDE_CHAVE_CIFRA:-}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      # Um container só aqui (sem réplica), então ele leva os 9 workers da
      # regra (2 x 4 núcleos) + 1. No Swarm o número cai pela metade, porque
      # lá são duas réplicas dividindo a mesma máquina.
      WEB_CONCURRENCY: "9"
      GUNICORN_THREADS: "2"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"

  web:
    build:
      context: ./frontendChamados
      args:
        # mesma origem do nginx: sem host, sem CORS
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # SÓ no loopback — mesmo padrão do sistemadeconcursos e do mangacutter.
      # Quem responde na 80/443 continua sendo o nginx do host, que já tem os
      # certificados; ele faz proxy_pass pra cá (deploy/nginx/host-chamados.conf).
      # Publicar em 0.0.0.0 aqui abriria uma segunda porta pública sem TLS.
      - "127.0.0.1:${HTTP_PORT:-8003}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params_chamados:/etc/nginx/proxy_params_chamados:ro
      # servidos direto pelo nginx, sem passar pelo gunicorn
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

volumes:
  db_data:
  static_data:
  media_data:
